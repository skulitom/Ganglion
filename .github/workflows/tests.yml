name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check ganglion tests
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ganglion demo --synthetic --seconds 5
      - run: uv run --no-sync ganglion reach-demo --environment synthetic --trials 2
      - run: uv run --no-sync ganglion drag-demo --environment synthetic --trials 1
